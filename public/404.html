<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>John Michael C. Ramos | AI-Driven Full Stack Developer</title>
    <script>
      (function () {
        var basePath = "/professional-portfolio";
        var path = window.location.pathname;

        if (path.indexOf(basePath) === 0) {
          path = path.slice(basePath.length);
        }

        var target = basePath + "/";

        if (path === "/about") target = basePath + "/#about";
        else if (path === "/work") target = basePath + "/#work";
        else if (path === "/contact") target = basePath + "/#contact";

        window.location.replace(target + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
